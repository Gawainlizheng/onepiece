<!DOCTYPE html>

  <style>

    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",sans-serif}a{color:inherit}a:focus-visible{outline:3px solid var(--accent);outline-offset:6px}header,main,footer{max-width:1240px;margin:auto;padding-left:6%;padding-right:6%}header{display:flex;justify-content:space-between;align-items:center;padding-top:30px;padding-bottom:30px;border-bottom:1px solid var(--line)}.brand{text-decoration:none;font-family:Georgia,serif;font-weight:bold;font-size:27px;letter-spacing:-1px}.brand span{color:var(--accent)}nav a{font-size:13px;text-decoration:none;margin-left:28px}nav a:hover{color:var(--accent)}.hero{display:grid;grid-template-columns:1.15fr 1fr;gap:36px;align-items:center;min-height:650px;padding:70px 0}.eyebrow{font-size:11px;letter-spacing:3px;font-weight:bold;color:var(--accent)}h1{font-family:Georgia,"Songti SC","SimSun",serif;font-size:clamp(52px,7vw,88px);font-weight:normal;line-height:1.18;letter-spacing:-3px;margin:27px 0}h1 em{font-style:normal;color:var(--accent)}.intro{max-width:360px;color:var(--muted);line-height:1.95;font-size:15px}.button{display:inline-flex;gap:35px;background:var(--ink);color:var(--paper);padding:16px 23px;margin-top:23px;text-decoration:none;font-size:13px;transition:background .2s,transform .2s}.button:hover{background:var(--accent);transform:translateY(-2px)}.art{position:relative;aspect-ratio:1/1.08;background:#e7ece5;border-radius:48% 48% 3px 3px;overflow:hidden}.art svg{width:100%;height:100%;display:block}.art-label{position:absolute;bottom:22px;left:25px;font-family:Georgia,serif;font-size:11px;letter-spacing:3px;color:#f6f3e9}.about{border-top:1px solid var(--line);padding:40px 0 65px;display:grid;grid-template-columns:1fr 2fr;gap:40px}.section-label{font-size:11px;letter-spacing:2px}.about h2{font-family:"Songti SC","SimSun",serif;font-size:28px;font-weight:normal;margin:0 0 14px}.about p{color:var(--muted);line-height:1.9;font-size:14px;max-width:540px;margin:0}footer{display:flex;justify-content:space-between;gap:20px;padding-top:23px;padding-bottom:25px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}footer a{text-decoration:none} @media(max-width:700px){header{padding-top:22px;padding-bottom:22px}nav a{margin-left:18px}.hero{grid-template-columns:1fr;padding:45px 0;gap:35px;min-height:0}h1{font-size:60px;margin:22px 0}.art{max-width:430px;width:100%;justify-self:center;aspect-ratio:1.15}.about{grid-template-columns:1fr;gap:20px;padding-bottom:40px}footer{flex-wrap:wrap}.intro{max-width:100%}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.button{transition:none}}

    <section class="about" id="about" aria-labelledby="about-title">
      <div class="section-label">01 / ABOUT THIS SPACE</div>
      <div><h2 id="about-title">每一段旅程，都从第一步开始。</h2><p>这里是 OnePiece 的起点。未来，我会慢慢把有趣的想法、正在做的项目，以及值得记住的瞬间放在这里。很高兴与你相遇，欢迎常来看看。</p></div>
